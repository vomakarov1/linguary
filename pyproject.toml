[project]
name = "linguary"
version = "0.1.0"
description = "Local processing of literary EPUB files through an LLM: translation, vocabulary hints, and language notes"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "pydantic>=2.11",
    "ebooklib>=0.19",
    "lxml>=5.4",
    "httpx>=0.28",
    "python-multipart>=0.0.32",
    "py3langid>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linguary"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow test (a real LLM, large EPUB files); excluded with -m \"not slow\"",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC", "S", "RUF"]
ignore = [
    "E501",    # Line length is not enforced globally
    "RUF001",  # Cyrillic characters in Russian UI/analysis strings
    "RUF002",  # Cyrillic characters in docstrings
    "RUF003",  # Cyrillic characters in comments
    "S101",    # assert statements
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
# SHA-256 pinned in comparison/workspace.py for P14 -> P15 verification
"src/linguary/comparison/late_metadata.py" = ["RUF021"]

[tool.ty.src]
include = ["src/linguary", "alembic"]

# SHA-256 pinned in comparison/workspace.py for P14 -> P15 verification.
[[tool.ty.overrides]]
include = ["src/linguary/comparison/late_metadata.py"]

[tool.ty.overrides.rules]
missing-union-attribute = "ignore"
