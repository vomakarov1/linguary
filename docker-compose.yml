services:
  linguary:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - LINGUARY_SERVER_HOST=0.0.0.0
      - LINGUARY_SERVER_PORT=8000
      - LINGUARY_STORAGE_DATA_ROOT=/data
      - LINGUARY_LLM_MODEL=${LINGUARY_LLM_MODEL:-gpt-4o-mini}
      - LINGUARY_LLM_API_KEY=${LINGUARY_LLM_API_KEY:-}
    volumes:
      - linguary_data:/data
    restart: unless-stopped

volumes:
  linguary_data:
